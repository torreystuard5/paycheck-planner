name: Changelog & commits

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install commitlint
        run: npm ci

      - name: Lint PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  changelog:
    name: Verify CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          version: latest
          config: cliff.toml
          args: -o CHANGELOG.md.verify

      - name: Compare generated changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md is missing. Run: npm run changelog"
            exit 1
          fi
          if ! diff -u CHANGELOG.md CHANGELOG.md.verify; then
            echo ""
            echo "CHANGELOG.md is out of date. On your machine run:"
            echo "  npm run changelog"
            echo "  git add CHANGELOG.md && git commit -m 'docs(changelog): update public release notes'"
            exit 1
          fi
          echo "CHANGELOG.md matches git-cliff output."

  update-changelog:
    name: Regenerate CHANGELOG.md
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          version: latest
          config: cliff.toml
          args: -o CHANGELOG.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "CHANGELOG.md already up to date."
            exit 0
          fi
          git commit -m "docs(changelog): regenerate public release notes"
          git push
