# git-cliff — PayDrift public changelog (user-facing feat/fix only)
# https://git-cliff.org/docs/configuration/

[changelog]
header = """
# Changelog

All notable **user-facing** changes to PayDrift.

Commit policy: [CONTRIBUTING.md](CONTRIBUTING.md)

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}

{% for group in changelog %}
### {{ group.title }}
{% for commit in group.commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor %}

{% endfor %}
"""
trim = true
footer = """
<!-- Generated by git-cliff. Run `npm run changelog` to refresh. -->
"""

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = false
topo_order = false
sort_commits = "oldest"

# First matching parser wins. Only feat/fix with allowed scopes reach the changelog.
commit_parsers = [
  { message = "^feat\\((admin|ops|infra|internal|dev|test)\\)", skip = true },
  { message = "^fix\\((admin|ops|infra|internal|dev|test)\\)", skip = true },
  { message = "^(chore|ci|build|docs|style|refactor|test)(\\(|!|:)", skip = true },
  { message = "^feat\\((?!auth\\b|budget\\b|transactions\\b|shopping-list\\b|household\\b|goals\\b|reports\\b|dashboard\\b|notifications\\b|billing\\b|onboarding\\b|mobile\\b|ui\\b|api\\b)[^)]+\\)", skip = true },
  { message = "^fix\\((?!auth\\b|budget\\b|transactions\\b|shopping-list\\b|household\\b|goals\\b|reports\\b|dashboard\\b|notifications\\b|billing\\b|onboarding\\b|mobile\\b|ui\\b|api\\b)[^)]+\\)", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = ".*", skip = true },
]

link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/torreystuard5/paycheck-planner/issues/$1" },
]

[remote.github]
owner = "torreystuard5"
repo = "paycheck-planner"
