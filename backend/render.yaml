databases:
  - name: paycheck-planner-db
    plan: free
    databaseName: paycheck_planner
    user: paycheck_planner_user

services:
  - type: web
    name: paycheck-planner-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paycheck-planner-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: SUPPORT_EMAIL
        value: spsoftwaresolutionsllc@gmail.com
      - key: FRONTEND_URL
        value: https://paycheck-planner.onrender.com
