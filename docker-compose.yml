services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: paydrift
      POSTGRES_PASSWORD: paydrift
      POSTGRES_DB: paydrift
    # 5433 avoids clashing with a local Postgres already bound to 5432 on the host.
    ports:
      - "5433:5432"
    volumes:
      - paydrift_pgdata:/var/lib/postgresql/data

volumes:
  paydrift_pgdata:
